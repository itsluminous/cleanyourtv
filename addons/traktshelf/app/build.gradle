plugins {
    id 'com.android.application'
}

// API keys come from a file that is never committed. Default: ../../work/secrets.env (the repo's git-ignored work/
// folder); override with -PsecretsFile=/path or the SECRETS_FILE environment variable. Lines: KEY=value.
// Without the file the app builds with empty keys: Trakt sign-in then says so on screen, nothing crashes.
def secrets = [:]
def secretsPath = project.findProperty('secretsFile') ?: System.getenv('SECRETS_FILE') ?: "${rootDir}/../../work/secrets.env"
def secretsFile = file(secretsPath)
if (secretsFile.isFile()) {
    secretsFile.eachLine { line ->
        def m = line.trim() =~ /^([A-Z0-9_]+)=(.*)$/
        if (m.matches()) secrets[m.group(1)] = m.group(2).trim().replaceAll(/^["']|["']$/, '')
    }
    logger.lifecycle("traktshelf: API keys read from ${secretsFile} (${secrets.keySet().sort().join(', ')})")
} else {
    logger.warn("traktshelf: no secrets file at ${secretsFile}; building with empty API keys")
}
def key = { String name -> '"' + (secrets[name] ?: '').replace('\\', '\\\\').replace('"', '\\"') + '"' }

android {
    namespace 'com.kupraki.traktshelf'
    compileSdk 34

    defaultConfig {
        applicationId 'com.kupraki.traktshelf'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '0.1'
        buildConfigField 'String', 'TRAKT_CLIENT_ID', key('TRAKT_CLIENT_ID')
        buildConfigField 'String', 'TMDB_API_KEY', key('TMDB_API_KEY')
        buildConfigField 'String', 'OMDB_API_KEY', key('OMDB_API_KEY')
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Sideloaded over ADB like the launcher: signed with the debug key. Sign your own releases with your key.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}

dependencies {
    // One widget library, for the poster rows. Networking is HttpURLConnection, JSON is org.json (both in Android),
    // the periodic sync is JobScheduler (also in Android): no other libraries.
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
}
